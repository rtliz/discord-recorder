apiVersion: v1
kind: Namespace
metadata:
  name: discord-recorder
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: discord-recorder
  namespace: discord-recorder
data:
  CLIENT_ID: "1567100785282781226"
  ALLOWED_USER_IDS: ""
  ALLOWED_GUILD_IDS: ""                       # server ที่ให้ใช้บอท คั่นด้วย , (ว่าง = ทุก server ที่เชิญ)
  GOOGLE_CLIENT_ID: ""
  DRIVE_FOLDER_ID: "your-drive-folder-id"
  SCREEN_ENABLED: "false"
  # PUBLIC_URL: "https://recorder.example.com"   # ใส่โดเมนจริงแล้วเอา # ออก (ต้องตรงกับ k8s/ingress.yaml) ไม่มี / ท้าย
  HTTP_PORT: "8080"
  CAPTURE_MAX_MB: "3072"                      # ต่อการอัดจอ 1 ครั้ง
  CAPTURE_TOTAL_MB: "8192"                    # รวมทุกการอัดจอที่ยังค้างในเครื่อง (emptyDir 20Gi, ตอนแปลงไฟล์ใช้อีกเท่าตัว)
  DELETE_AFTER_UPLOAD: "true"                 # อัปโหลด Drive สำเร็จแล้วลบไฟล์ในเครื่อง
  AGENT_CODE_PAIRING: "false"                 # ปิดการจับคู่ด้วยรหัส 6 หลัก (ใช้เฉพาะ dev ที่รัน npm run agent) บน k8s ใช้แค่คำสั่งติดตั้งที่มี token
  # AGENTS_FILE: "/app/data/agents.json"      # ที่เก็บ credential ของตัวอัด (ค่าเริ่มต้น data/agents.json อยู่บน PVC อยู่แล้ว)
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: discord-recorder-data
  namespace: discord-recorder
spec:
  accessModes: [ReadWriteOnce]
  # storageClassName: standard   # ใส่ชื่อ storage class ของ cluster ถ้าไม่มี default class (ดู: kubectl get storageclass)
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: discord-recorder
  namespace: discord-recorder
spec:
  replicas: 1            # ต้องมีตัวเดียว: gateway bot รันซ้ำจะตอบคำสั่งซ้ำ
  strategy:
    type: Recreate       # ไม่ให้ pod เก่า/ใหม่เชื่อม gateway พร้อมกัน
  selector:
    matchLabels: { app: discord-recorder }
  template:
    metadata:
      labels: { app: discord-recorder }
    spec:
      terminationGracePeriodSeconds: 60   # ให้เวลา mix/อัปโหลดไฟล์ที่ค้างอยู่
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: bot
          image: REGISTRY/discord-recorder:latest   # แก้เป็น image ของคุณ
          envFrom:
            - configMapRef: { name: discord-recorder }
            - secretRef: { name: discord-recorder }
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests: { cpu: 100m, memory: 256Mi, ephemeral-storage: 10Gi }
            limits: { cpu: "1", memory: 1Gi, ephemeral-storage: 22Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: recordings, mountPath: /app/recordings }
            - { name: data, mountPath: /app/data }   # settings.json + agents.json (ต้องอยู่รอดตอน restart ไม่งั้นตัวอัดต้องจับคู่ใหม่)
      volumes:
        - name: recordings
          emptyDir:
            sizeLimit: 20Gi   # PCM ดิบ ~11.5MB/นาที/คนที่พูด; video ≈0.9GB/ชม. ต่อคน ×2 ตอนแปลงไฟล์
        - name: data
          persistentVolumeClaim:
            claimName: discord-recorder-data
---
apiVersion: v1
kind: Service
metadata:
  name: discord-recorder
  namespace: discord-recorder
spec:
  type: ClusterIP
  selector: { app: discord-recorder }
  ports:
    - name: http
      port: 80
      targetPort: http
